name: Release Node SDK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'node-v')
    runs-on: [self-hosted, yario-ci]
    environment: npm
    steps:
      - name: Verify scoped npm publishing credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Scoped NPM_PUBLISH_TOKEN is required" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Set up job-local npm
        run: |
          npm install --prefix "$RUNNER_TEMP/yario-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --ignore-scripts --no-audit --no-fund npm@11.16.0
          echo "$RUNNER_TEMP/yario-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - run: npm publish --workspace packages/node --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Remove job-local npm
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/yario-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
